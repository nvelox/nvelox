# /etc/nvelox/nvelox.conf
# Main Configuration File

# Server Settings
version: "2"
server:
  user: "nvelox"
  group: "nvelox"
  pid_file: "/var/run/nvelox.pid"

# Logging Configuration
logging:
  level: "info" # debug, info, warning, error
  access_log: "/var/log/nvelox/access.log"
  error_log: "/var/log/nvelox/error.log"

# Modular Includes
# Include additional configuration files (e.g., listeners, backends)
include: "/etc/nvelox/config.d/*.yaml"

# Listeners and Backends can also be defined here directly
listeners:
  # Basic TCP listener
  - name: "web-traffic"
    bind: ":80"
    protocol: "tcp"
    default_backend: "web-cluster"

  # TLS-terminated listener
  - name: "web-traffic-tls"
    bind: ":443"
    protocol: "tcp"
    default_backend: "web-cluster"
    tls:
      cert: "/etc/ssl/certs/server.pem"
      key: "/etc/ssl/private/server.key"

  # Rate-limited listener
  - name: "api-gateway"
    bind: ":8080"
    protocol: "tcp"
    default_backend: "api-servers"
    rate_limit:
      connections_per_second: 100
      burst: 50

  # Port range with zero-copy (gaming / VoIP)
  - name: "dynamic-ports"
    bind: ":10000-11000"
    protocol: "tcp"
    zero_copy: true
    default_backend: "tunnel-nodes"

  # HTTP/HTTPS L7 reverse proxy with routing
  - name: "web-gateway"
    bind: ":443"
    protocol: "https"
    http3: true  # Enable QUIC/HTTP3 on same port
    tls:
      cert: "/etc/ssl/certs/server.pem"
      key: "/etc/ssl/private/server.key"
    default_backend: "web-cluster"
    headers:
      response_add:
        Strict-Transport-Security: "max-age=31536000"
    routes:
      - match:
          host: "api.example.com"
        backend: "api-servers"
      - match:
          path_prefix: "/static"
        backend: "web-cluster"

  # Plain HTTP listener
  - name: "http-redirect"
    bind: ":80"
    protocol: "http"
    default_backend: "web-cluster"

  # UDP listener (session affinity via connection pool)
  - name: "dns-proxy"
    bind: ":5353"
    protocol: "udp"
    default_backend: "dns-servers"

backends:
  - name: "web-cluster"
    balance: "roundrobin"
    servers:
      - "10.0.0.1:8080"
      - "10.0.0.2:8080"
    health_check:
      active:
        type: "http"
        interval: "5s"
        timeout: "1s"
        path: "/health"

  - name: "api-servers"
    balance: "leastconn"
    send_proxy_v2: true
    servers:
      - "10.0.0.1:8080"
      - "10.0.0.2:8080"
    health_check:
      active:
        type: "tcp"
        interval: "5s"
        timeout: "1s"

  - name: "tunnel-nodes"
    balance: "leastconn"
    servers:
      - "10.0.1.5" # 1:1 Port Mapping (e.g. 10001 -> 10.0.1.5:10001)
      - "10.0.1.6"

  - name: "dns-servers"
    balance: "random"
    servers:
      - "10.0.2.1:53"
      - "10.0.2.2:53"
