# /etc/nvelox/nvelox.yaml — Complete Reference Configuration
# Every feature is shown below. Remove what you don't need.

version: "2"

# ─── Server Settings ───────────────────────────────────────
server:
  # gateway_id: "gw-1"  # gw=<id> on HTTP access-log lines (default: hostname)
  # user / group / pid_file / workers are accepted but NOT implemented:
  # nvelox never drops privileges, writes no pid file and runs one process.
  # When set (and the process is not already that user/group) nvelox prints a
  # WARNING at startup. Run it under systemd User=/Group= with
  # AmbientCapabilities=CAP_NET_BIND_SERVICE to bind ports below 1024.
  # user: "nvelox"
  # group: "nvelox"

# ─── Logging ───────────────────────────────────────────────
# Log files are created 0640 in 0750 directories (an existing file is
# tightened to 0640). After logrotate moves them away, send SIGUSR1
# (`kill -USR1 <pid>`, or `systemctl kill -s USR1 nvelox` under systemd)
# and nvelox reopens both; SIGHUP reopens them too, then reloads.
logging:
  level: "info"  # debug, info, warning, error
  access_log: "/var/log/nvelox/access.log"  # Per-request CLF format
  error_log: "/var/log/nvelox/error.log"

# ─── Prometheus Metrics ───────────────────────────────────
# No authentication. Loopback only by default (an empty bind means
# 127.0.0.1:9090). To scrape from another host, bind a private interface IP
# and firewall the port to your Prometheus servers — never a public
# address. In a container, loopback is unreachable from outside: bind
# "0.0.0.0:9090" there and publish the port to trusted networks only.
metrics:
  enabled: true
  bind: "127.0.0.1:9090"
  path: "/metrics"

# ─── Admin API ─────────────────────────────────────────────
admin:
  enabled: false
  bind: "127.0.0.1:9091"  # empty = 127.0.0.1:9091 (loopback only)
  # api_key is REQUIRED when enabled: nvelox refuses to start without it.
  # Sent as the X-API-Key header and compared in constant time. Use a long
  # random value (`openssl rand -hex 32`): a valid key is always served, and
  # 10 failed attempts from one IP in 10m only throttle that IP's further
  # failures (429) for 15m.
  # api_key: "set-from-env-or-vault"
  # Requests must name the bind address in the Host header, POST needs
  # "Content-Type: application/json", and browser cross-site requests are
  # refused. On a non-loopback bind, firewall the port to the managing hosts.
  # Endpoints:
  #   GET    /api/v1/stats
  #   GET    /api/v1/backends
  #   POST   /api/v1/backends/{name}/drain?server=addr
  #   POST   /api/v1/backends/{name}/enable?server=addr
  #   POST   /api/v1/backends/{name}/disable?server=addr
  #   GET    /api/v1/denylist
  #   POST   /api/v1/denylist {"ip": "<ip or cidr>", "ttl_seconds": N}
  #          (ttl <= 0 = until restart; ranges wider than /8 IPv4 or
  #          /16 IPv6 are refused)
  #   DELETE /api/v1/denylist?cidr=<ip or cidr>

# Hot reload: `kill -HUP $(pidof nvelox)` (or `systemctl reload nvelox`)
# applies the current contents of this file without dropping connections.
# Covers backends (balancer/sticky/CB state preserved on rename), per-
# listener routes/ACL/headers, TLS certs (Let's Encrypt rotation), and
# bind addresses (added or removed with 10s graceful drain). All-or-
# nothing: pre-flight aborts the apply if any new bind addr is unbindable
# or the new config is invalid. See examples/32-hot-reload.yaml.

# ─── OpenTelemetry Tracing ─────────────────────────────────
# tracing:
#   enabled: true
#   endpoint: "http://jaeger:4318"
#   service: "nvelox"

# ─── Modular Config Includes ──────────────────────────────
include: "/etc/nvelox/config.d/*.yaml"

# ═══════════════════════════════════════════════════════════
# LISTENERS
# ═══════════════════════════════════════════════════════════

listeners:

  # ─── HTTP → HTTPS redirect ─────────────────────────────
  - name: "http-redirect"
    bind: ":80"
    protocol: "http"
    routes:
      - match:
          path_prefix: "/"
        redirect:
          url: "https://${host}${uri}"  # Variable substitution
          code: 301
    # Redirect routes don't need a backend

  # ─── HTTPS with HTTP/2 + HTTP/3 ────────────────────────
  - name: "https-main"
    bind: ":443"
    protocol: "https"
    http3: true  # QUIC on same port, advertises Alt-Svc
    backend: "web-cluster"
    # Multiple HTTPS listeners may share the same `bind:` — see the
    # "Multi-server-per-port" section below for how SNI + server_names
    # route requests across them.
    tls:
      cert: "/etc/ssl/certs/server.pem"
      key: "/etc/ssl/private/server.key"
      # client_auth: "require"         # mTLS: "require" (verified cert needed),
      #                                #   "request" (asked, not required), "none"
      # client_ca: "/etc/ssl/ca.pem"   # PEM CA bundle; required by "require".
      #   Per site when several https listeners share a bind (chosen by SNI);
      #   a request whose Host names a client_auth site over a connection
      #   whose SNI chose another site gets 421. Also applies to http3 and to
      #   TLS-terminating tcp listeners. A missing / unparseable CA fails the
      #   load. (ocsp_stapling is not implemented and is rejected.)
      # min_version: "1.2"             # "1.2" or "1.3" (defaults 1.2)
      # max_version: "1.3"             # defaults 1.3
      # cipher_suites:                 # TLS 1.2 only; TLS 1.3 suites are
      #   - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      #   - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    # trusted_proxies: ["10.0.0.2/32"]
    #   When set, X-Forwarded-For / X-Real-IP from peers in these CIDRs
    #   are trusted and appended; everyone else gets their forged
    #   headers replaced with the authoritative peer IP. This list ALSO
    #   governs nvelox's own client-IP decisions: the access log, ip_allowlist,
    #   ip_denylist, ip_rate_limit and acl resolve the real client from XFF /
    #   X-Real-IP for trusted peers. SECURITY: scope this to the real upstream
    #   proxy IPs only — never a broad range. Behind a k8s Service with
    #   externalTrafficPolicy:Cluster, kube-proxy SNATs every packet to a node
    #   IP, so a broad CIDR (e.g. 10.0.0.0/8) trusts ALL inbound traffic and
    #   makes every IP-based control forgeable; prefer externalTrafficPolicy:
    #   Local and/or firewall the listener to the proxy.
    # accept_proxy_from: ["10.50.0.0/16"]
    #   L4 inbound PROXY-protocol-v2 trust (tcp / https-passthrough listeners).
    #   For connections from these CIDRs, nvelox parses the inbound PROXY-v2
    #   header and uses its source as the real client (then forwards it via
    #   send_proxy_v2 to the backend). Peers OUTSIDE the list have any inbound
    #   PROXY header IGNORED — the real TCP peer is used — so a direct client
    #   cannot spoof its source. Non-PROXY clients (browsers) pass through
    #   unchanged. Empty (default) = trust nobody. Use this on a region's edge
    #   to accept the PROXY-v2 header that a PEER region's tunnel-server relay
    #   prepends, preserving the real client IP across a cross-region hop.

    # Timeouts (HTTP/HTTPS listeners). All values accept Go duration
    # strings ("30s", "5m", "1h"). An explicit "0" means unlimited.
    #
    #   read_header — slowloris guard for header parsing. Shared across
    #                 sites on the same bind port; the engine takes the
    #                 max configured value (or 10s default).
    #   read        — whole-request budget (headers + body). Applied
    #                 per-request after Host-based routing, so two sites
    #                 sharing a bind can use different values. 60s default.
    #   write       — whole-response budget. Per-request like read. 60s.
    #   idle        — keep-alive idle between requests on a connection.
    #                 Shared across sites; max wins. 120s default.
    timeouts:
      read_header: "10s"
      read: "30s"
      write: "30s"
      idle: "120s"

    # Rate limiting
    rate_limit:
      connections_per_second: 500
      burst: 100
    ip_rate_limit:
      requests_per_second: 50
      burst: 20

    # Security (ip_denylist / ip_allowlist / acl also work on tcp and udp
    # listeners, per connection / UDP session; there an acl rule may only
    # match source_ip). Entries must be IPs or CIDRs (a bad one fails the
    # load); "0.0.0.0/0" here and in acl source_ip means every client, IPv6 too.
    ip_denylist: ["192.168.100.0/24"]
    # ip_allowlist: ["10.0.0.0/8"]  # If set, only listed CIDRs allowed
    max_body_size: "10MB"
    # ACL path_prefix / path_regex see the canonical path ("//admin",
    # "/x/../admin" and "/%2e/admin" are "/admin"); a deny rule also matches
    # the path without ";params". Matching is case-sensitive: write
    # path_regex: "(?i)^/admin(/|$)" in front of a case-insensitive backend.
    acl:
      - match:
          method: ["DELETE"]
          source_ip: ["0.0.0.0/0"]
        action: "deny"

    # Response processing
    compression:
      enabled: true
      types: ["text/html", "application/json", "text/css", "application/javascript"]
      min_length: 1024   # by Content-Length (as nginx); unknown length is compressed

    # Only a 200 received in full is cached; Range / If-* requests bypass the
    # cache. One entry holds at most 8MB (or max_size); unset max_size = 64MB.
    cache:
      enabled: true
      max_size: "256MB"
      default_ttl: "5m"
      methods: ["GET"]

    # Error pages (custom HTML files, falls back to built-in styled pages)
    # error_pages:
    #   404: "/var/www/errors/404.html"
    #   502: "/var/www/errors/502.html"

    # Header manipulation (applied to all routes on this listener)
    headers:
      request_add:
        X-Proxy: "nvelox"
      response_add:
        Strict-Transport-Security: "max-age=31536000"
        X-Content-Type-Options: "nosniff"
      response_remove:
        - "Server"

    # L7 Routes (first match wins)
    routes:
      # API routing by host
      - match:
          host: "api.example.com"
        backend: "api-servers"
        headers:
          request_add:
            X-Route: "api"

      # Regex route with URL rewrite
      - match:
          path_regex: "^/api/v(\\d+)/(.*)"
        rewrite:
          path: "/v$1/$2"
        backend: "api-servers"

      # Static assets with long cache
      - match:
          path_regex: "\\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$"
        static:
          root: "/var/www/html"
        try_files:
          files: ["$uri"]
          fallback: "=404"
        expires: "1y"

      # PHP files via FastCGI. document_root is required, and nvelox must
      # see it at the same path as PHP-FPM: only an existing .php file
      # inside it is handed to PHP-FPM — anything else is a 404 from nvelox.
      - match:
          path_regex: "\\.php(/|$)"
        fastcgi:
          pass: "127.0.0.1:9000"           # or "unix:/var/run/php-fpm.sock"
          document_root: "/var/www/html"
          split_path_info: "^(.+\\.php)(/.*)$"
          params:
            HTTPS: "on"

      # Catch-all: try static, fall back to the PHP front controller. The
      # fallback is an internal redirect (as in nginx): /index.php — with
      # the query string as QUERY_STRING — goes through the ACL and the
      # routes again and lands on the PHP route above. Static routes never
      # serve .php/.phtml/.phar files as files.
      - match:
          path_prefix: "/"
        static:
          root: "/var/www/html"
          index: ["index.html"]
        try_files:
          files: ["$uri", "$uri/"]
          fallback: "/index.php$is_args$args"

      # (routes[].scripts — Lua hooks — are not implemented; a route that
      # sets them is rejected at load.)

  # ─── TCP L4 proxy (gaming/tunneling) ───────────────────
  # L4 TCP sessions follow standard half-close semantics: when either side
  # finishes (FIN), everything already read from it is delivered to the other
  # side, then only that write direction is shut down; the opposite direction
  # keeps flowing until it ends too. Only a real error (RST) aborts both.
  #   timeouts.idle    — close a session after no bytes moved in EITHER
  #                      direction for this long, including a half-closed
  #                      one. Default 5m on plain tcp listeners ("0" =
  #                      never); on tls-terminating tcp listeners only when set.
  #   timeouts.connect — backend dial timeout (default 10s).
  #   zero_copy        — accepted for compatibility; no effect (L4 TCP uses a
  #                      16 KiB buffered copy per direction).
  - name: "game-ports"
    bind: ":10000-10100"
    protocol: "tcp"
    zero_copy: true
    backend: "game-servers"

  # ─── Dedicated-port MUX (range → one backend port) ─────
  # Bind a whole dedicated range but forward EVERY port to ONE backend port
  # (give the backend an explicit port → nvelox does NOT append the listener
  # port, so all ports funnel to that one socket). With send_proxy_v2, the
  # PROXY-v2 header's DESTINATION is the port the client actually hit (the
  # dedicated port), so the single backend listener can de-multiplex the whole
  # range from one socket — no per-port listener. accept_proxy_from lets the
  # backend also trust a relayed inbound header (cross-region). This is how the
  # tunnel-server serves 10k–100k dedicated ports without 10k–100k listeners.
  # - name: "dedicated-mux"
  #   bind: ":17000-17100"          # the dedicated range (grow as needed)
  #   protocol: "tcp"
  #   zero_copy: true
  #   backend: "tunnel-mux"         # backend MUST specify an explicit port (the mux port)
  #   accept_proxy_from: ["10.50.0.0/16"]   # trust relayed PROXY headers from peer regions
  # (and a matching backend, e.g.)
  # backends:
  #   - name: "tunnel-mux"
  #     servers: ["10.1.0.5:17999"]  # explicit mux port → all range ports land here
  #     send_proxy_v2: true

  # ─── TLS passthrough ───────────────────────────────────
  # A tcp listener without a tls block forwards TLS untouched to its one
  # backend. (sni_routes — routing passthrough by SNI — is not implemented;
  # a listener that sets it is rejected at load.)

  # ─── Multi-server-per-port (nginx-style) ───────────────
  # Multiple HTTPS listeners may share the same `bind:`. Each is its own
  # "site": its own cert, its own routes/headers/ACL, its own backend.
  # nvelox picks the cert via SNI and dispatches by Host header. Exact
  # name > leftmost wildcard > default_server. Detailed walkthrough in
  # examples/31-multisite-per-port.yaml.
  # - name: "api-site"
  #   bind: ":8443"
  #   protocol: "https"
  #   server_names: ["api.example.com", "api.example.org"]
  #   tls: { cert: "/etc/ssl/api.pem", key: "/etc/ssl/api.key" }
  #   backend: "api-servers"
  # - name: "web-site-default"
  #   bind: ":8443"
  #   protocol: "https"
  #   default_server: true                        # catch-all for unknown SNI
  #   tls: { cert: "/etc/ssl/wildcard.pem", key: "/etc/ssl/wildcard.key" }
  #   backend: "web-cluster"

  # ─── UDP proxy ─────────────────────────────────────────
  # Each client source ip:port is one session (own backend socket). Fixed
  # limits: 16384 sessions per process, 512 per client IP; a session ends
  # 10s after its first datagram if the backend never answered, else 60s
  # after the backend's last reply. With accept_proxy_from, every datagram
  # from a trusted relay must carry a PROXY v2 header (others are dropped).
  - name: "dns-proxy"
    bind: ":5353"
    protocol: "udp"
    backend: "dns-servers"

  # ─── Dedicated-UDP MUX (range → one backend UDP port) ──
  # The UDP counterpart of "dedicated-mux" above (cross-region UDP). Funnel the
  # whole dedicated UDP range to ONE backend UDP port (give the backend an
  # explicit port so nvelox does NOT append the listener port). With
  # send_proxy_v2 the per-datagram PROXY-v2 DGRAM header's DESTINATION is the
  # dedicated port the client hit, so the tunnel-server UDP mux de-multiplexes the
  # whole range from one socket. accept_proxy_from trusts a peer-region relay's
  # inbound header so the REAL client (not the relay) is preserved end-to-end.
  # NOTE: the mux backend port must be firewalled to nvelox/peer-regions only —
  # it trusts the PROXY header. See docs/CROSS_REGION_TCP_UDP_PROXY.md (#77).
  # - name: "dedicated-udp-mux"
  #   bind: ":17000-17100"          # the dedicated UDP range
  #   protocol: "udp"
  #   backend: "tunnel-udp-mux"     # backend MUST specify an explicit port (the UDP mux port)
  #   accept_proxy_from: ["10.50.0.0/16"]   # trust relayed PROXY headers from peer regions
  # (and a matching backend, e.g.)
  # backends:
  #   - name: "tunnel-udp-mux"
  #     servers: ["10.1.0.5:7444"]  # explicit UDP mux port (TUNNEL_SERVER_UDP_MUX_PORT)
  #     send_proxy_v2: true

# ═══════════════════════════════════════════════════════════
# BACKENDS
# ═══════════════════════════════════════════════════════════

backends:
  - name: "web-cluster"
    balance: "roundrobin"  # roundrobin, leastconn, random
    max_connections: 200   # concurrent HTTP requests / TCP conns / UDP sessions
    # send_proxy_v2 prepends a PROXY protocol v2 header so the backend
    # sees the real client address.
    #   - TCP backends: header sent once per connection (STREAM variant).
    #   - UDP backends: header prepended to each datagram (DGRAM variant)
    #     so QUIC/HTTP3 backends can recover the client IP per packet.
    send_proxy_v2: false

    # Timeouts (override listener defaults)
    timeouts:
      connect: "3s"
      read: "15s"

    # Retry on failure. "connect_failure": the server gave no response
    # (the default when "on" is empty); "502" / "503": it answered with that
    # status. A request is resent only if it never reached the server with
    # its body untouched, or if it has no body and an idempotent method.
    retry:
      attempts: 3
      on: "connect_failure,502,503"

    # Sticky sessions. cookie: the cookie names the server (set on the first
    # response, HttpOnly, SameSite=Lax, Secure over TLS); header: keyed by a
    # hash of the header value (values over 256 bytes are ignored).
    sticky_session:
      type: "cookie"           # cookie, header, ip_hash
      cookie_name: "NVELOX_SRV"
      ttl: "1h"

    # Health checks
    health_check:
      active:
        type: "http"           # tcp or http
        path: "/health"
        interval: "5s"
        timeout: "2s"
      passive:
        max_fails: 3           # Out of rotation for 30s after 3 consecutive backend failures

    # Circuit breaker
    circuit_breaker:
      enabled: true
      threshold: 5             # Failures to open circuit
      timeout: "30s"           # Time before half-open probe
      half_open_max: 2         # Probe requests in half-open state

    # Backend TLS (connect to upstream via TLS — http/https listeners only;
    # a tcp/udp listener on a backend_tls backend is rejected at load).
    # Defaults are secure: InsecureSkipVerify=false, system roots,
    # MinVersion=TLS1.2. Setting `insecure: true` explicitly opts out of cert
    # verification and is logged at WARN on startup. A ca_cert or client
    # key pair that cannot be loaded fails the load / reload — nvelox never
    # falls back to plaintext.
    # backend_tls:
    #   enabled: true
    #   ca_cert: "/etc/ssl/ca.pem"
    #   client_cert: "/etc/ssl/client.pem"       # mTLS to backend
    #   client_key:  "/etc/ssl/client.key"       # both or neither
    #   insecure: false

    # DNS service discovery (re-resolve hostnames in `servers:`).
    # resolve_interval: "30s"
    # allow_private_ips: false                   # default. When true,
    #   backend hostnames may resolve to RFC1918 / 127/8 / link-local /
    #   CGNAT. Leave false unless backends actually live on a private
    #   network — prevents DNS-rebinding SSRF on public hostnames.

    servers:
      - "10.0.0.1:8080"
      - "10.0.0.2:8080"

  - name: "api-servers"
    balance: "leastconn"
    servers:
      - "10.0.1.1:8080"
      - "10.0.1.2:8080"

  - name: "game-servers"
    balance: "roundrobin"
    servers:
      - "10.0.2.1"  # 1:1 port mapping (e.g., :10050 → 10.0.2.1:10050)
      - "10.0.2.2"

  - name: "dns-servers"
    balance: "random"
    servers:
      - "10.0.3.1:53"
      - "10.0.3.2:53"
