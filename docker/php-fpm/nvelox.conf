# nvelox config used by docker-compose.yml in this directory.
# Listens on :8080, serves static files from /var/www/html, and forwards
# *.php to the `php-fpm` service over FastCGI.

version: "2"

logging:
  level: "info"
  # No file paths: logs go to stdout/stderr so `docker compose logs nvelox`
  # shows them.

listeners:
  - name: "web"
    bind: ":8080"
    protocol: "http"
    backend: "noop-pool"            # required by the schema; unused for these routes

    routes:
      # PHP files → FastCGI to PHP-FPM. split_path_info captures
      # /index.php/some/path → SCRIPT_NAME=/index.php, PATH_INFO=/some/path.
      - match:
          path_regex: "\\.php(/|$)"
        fastcgi:
          pass: "php-fpm:9000"
          document_root: "/var/www/html"
          split_path_info: "^(.+\\.php)(/.*)$"

      # Catch-all: try the literal URI as a static file; if that doesn't
      # exist fall through to /index.php (front-controller pattern).
      # Deliberately no `index:` here — that would make nvelox serve
      # index.php as raw text. The try_files fallback to /index.php
      # routes back through the PHP regex match above instead.
      - match:
          path_prefix: "/"
        static:
          root: "/var/www/html"
        try_files:
          files: ["$uri", "$uri/"]
          fallback: "/index.php$is_args$args"
        fastcgi:
          pass: "php-fpm:9000"
          document_root: "/var/www/html"

backends:
  # nvelox requires every L7 listener to declare a backend (or routes).
  # We use a placeholder; the FastCGI / static routes above never touch it.
  - name: "noop-pool"
    balance: "roundrobin"
    servers:
      - "127.0.0.1:1"               # not reachable; reaching it = config bug
