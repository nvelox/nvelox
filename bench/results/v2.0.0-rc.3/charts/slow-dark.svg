<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 288" width="700" height="288" role="img" aria-label="A slow client: what each proxy holds ahead of the client" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>A slow client: what each proxy holds ahead of the client</title><rect width="700" height="288" rx="8" fill="#0d1117"/><text x="14.0" y="26.0" font-size="15" fill="#f0f6fc" text-anchor="start" font-weight="600">A client that reads slowly</text><text x="14.0" y="45.0" font-size="12" fill="#9198a1" text-anchor="start" font-weight="400">One 1 GiB download read at 20 MiB/s: the most the origin was ahead of the client. MiB, logarithmic scale.</text><line x1="150.0" y1="56.0" x2="150.0" y2="254.0" stroke="#3d444d" stroke-width="1"/><text x="150.0" y="270.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1 MiB</text><line x1="289.5" y1="56.0" x2="289.5" y2="254.0" stroke="#3d444d" stroke-width="1"/><text x="289.5" y="270.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">10 MiB</text><line x1="429.0" y1="56.0" x2="429.0" y2="254.0" stroke="#3d444d" stroke-width="1"/><text x="429.0" y="270.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100 MiB</text><line x1="568.6" y1="56.0" x2="568.6" y2="254.0" stroke="#3d444d" stroke-width="1"/><text x="568.6" y="270.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">1000 MiB</text><text x="140.0" y="76.0" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">Caddy 2.11.9</text><path d="M150.0 65.0H244.4a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0H150.0z" fill="#4f83dd"/><text x="253.4" y="76.0" font-size="11.5" fill="#f0f6fc" text-anchor="start" font-weight="400">5 MiB</text><text x="140.0" y="100.0" font-size="12" fill="#9198a1" text-anchor="end" font-weight="400">nvelox 1.3.0</text><path d="M150.0 89.0H245.5a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0H150.0z" fill="#4f83dd"/><tex