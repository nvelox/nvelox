# HAProxy under test. Keep-alive and connection reuse are HAProxy's defaults. The access log is
# off except on the :27123 frontend of the access-log test, which logs to a ring nobody reads.
# HAProxy has no UDP proxy.
global
    nbthread __WORKERS__
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2

ring logring
    description "access-log sink, nobody reads it"
    format rfc3164
    maxlen 1200
    size 1048576

defaults
    mode http
    timeout connect 5s
    timeout client 600s
    timeout server 600s
    timeout http-keep-alive 600s

frontend fe_http
    bind 127.0.0.1:27120
    default_backend be_origin

frontend fe_https
    bind 127.0.0.1:27121 ssl crt /certs/combined.pem
    default_backend be_origin

frontend fe_http_log
    bind 127.0.0.1:27123
    log ring@logring local0
    option httplog
    default_backend be_origin

# HTTP/2
frontend fe_h2
    bind 127.0.0.1:27124 ssl crt /certs/combined.pem alpn h2,http/1.1
    default_backend be_origin

# HTTP/3
frontend fe_h3
    bind quic4@127.0.0.1:27125 ssl crt /certs/combined.pem alpn h3
    default_backend be_origin

backend be_origin
    http-reuse safe
    server origin 127.0.0.1:27000

# Large uploads, to the sink (the large downloads use fe_http)
frontend fe_upload
    bind 127.0.0.1:27127
    default_backend be_sink

backend be_sink
    http-reuse safe
    server sink 127.0.0.1:27600

frontend fe_tcp
    mode tcp
    bind 127.0.0.1:27122
    default_backend be_origin_tcp

backend be_origin_tcp
    mode tcp
    server origin 127.0.0.1:27000
