# nginx under test. Not nginx's defaults, each in nginx's favour: a keep-alive pool to the origin
# (nginx has none by default), a high keepalive_requests (the default of 1000 would force
# reconnects), reuseport (an even spread over the workers), quic_gso for HTTP/3.
# The access log is off except on the :27113 listener of the access-log test.
# Large objects: the HTTP listener (:27110) serves the downloads with nginx's defaults, :27118 tuned
# for large files; :27117 takes the uploads with nginx's default buffering, :27119 streams them.
# The temp files (/var/cache/nginx) are in memory here, so they cost no disk writes.
worker_processes __WORKERS__;
worker_rlimit_nofile 200000;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 20000; }

http {
    access_log off;
    tcp_nodelay on;
    keepalive_timeout 600s;
    keepalive_requests 100000000;

    upstream origin {
        server 127.0.0.1:27000;
        keepalive 256;
        keepalive_requests 100000000;
        keepalive_timeout 600s;
    }

    upstream sink {
        server 127.0.0.1:27600;
        keepalive 256;
        keepalive_requests 100000000;
        keepalive_timeout 600s;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # HTTP
    server {
        listen 127.0.0.1:27110 reuseport backlog=65535;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    # Large uploads, nginx's defaults but for the size limit: the whole body is buffered before it goes upstream
    server {
        listen 127.0.0.1:27117 reuseport backlog=65535;
        client_max_body_size 0;
        location / {
            proxy_pass http://sink;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    # Large downloads, tuned for large files: no temp files, 16 buffers of 64k
    server {
        listen 127.0.0.1:27118 reuseport backlog=65535;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_max_temp_file_size 0;
            proxy_buffer_size 64k;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 128k;
        }
    }
    # Large uploads, streamed upstream
    server {
        listen 127.0.0.1:27119 reuseport backlog=65535;
        client_max_body_size 0;
        location / {
            proxy_pass http://sink;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
        }
    }
    # HTTPS
    server {
        listen 127.0.0.1:27111 ssl reuseport backlog=65535;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    # HTTP with one access-log line per request, discarded
    server {
        listen 127.0.0.1:27113 reuseport backlog=65535;
        access_log /dev/null combined;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    # HTTP/2
    server {
        listen 127.0.0.1:27114 ssl reuseport backlog=65535;
        http2 on;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
    # HTTP/3
    server {
        listen 127.0.0.1:27115 quic reuseport;
        http3 on;
        quic_gso on;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

stream {
    # TCP
    upstream origin_tcp { server 127.0.0.1:27000; }
    server {
        listen 127.0.0.1:27112 reuseport backlog=65535;
        proxy_pass origin_tcp;
    }
    # UDP: one session per client address and port while it is active (nginx's default, and how
    # nvelox works). proxy_timeout 60s is nvelox's idle timeout for a UDP session.
    upstream origin_udp { server 127.0.0.1:27500; }
    server {
        listen 127.0.0.1:27116 udp reuseport;
        proxy_pass origin_udp;
        proxy_timeout 60s;
    }
}
