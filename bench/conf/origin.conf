# The origin behind every proxy: nginx serving two fixed files from /data, and the files of the
# large-object tests from /big (in memory), on its own cores.
# It has to stay well ahead of every proxy under test; each round measures it alone first.
worker_processes __ORIGIN_WORKERS__;
worker_rlimit_nofile 200000;
pid /tmp/origin.pid;
error_log /dev/stderr warn;
events { worker_connections 20000; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 600s;
    keepalive_requests 100000000;
    open_file_cache max=100 inactive=600s;
    open_file_cache_valid 600s;
    default_type application/octet-stream;
    server {
        listen 127.0.0.1:27000 reuseport backlog=65535;
        root /data;
        location /big/ { root /; }
    }
}
