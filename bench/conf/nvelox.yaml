# nvelox under test (the release binary; one event loop per core it may use).
# nvelox writes its access log in every HTTP test (here to /dev/null), so the "http" listener also
# serves the test with the access log on. HTTPS, HTTP/2 and HTTP/3 share the "https" listener.
version: "2"
logging:
  level: "error"
  access_log: "/dev/null"
listeners:
  - name: "http"
    bind: "127.0.0.1:27100"
    protocol: "http"
    backend: "origin"
  - name: "https"
    bind: "127.0.0.1:27101"
    protocol: "https"
    http3: true
    backend: "origin"
    tls:
      cert: "/certs/cert.pem"
      key: "/certs/key.pem"
  - name: "tcp"
    bind: "127.0.0.1:27102"
    protocol: "tcp"
    backend: "origin"
  - name: "udp"
    bind: "127.0.0.1:27106"
    protocol: "udp"
    backend: "origin_udp"
  # the large uploads go to the sink; the large downloads use the "http" listener
  - name: "upload"
    bind: "127.0.0.1:27107"
    protocol: "http"
    backend: "sink"
backends:
  - name: "origin"
    balance: "roundrobin"
    servers:
      - "127.0.0.1:27000"
  - name: "origin_udp"
    balance: "roundrobin"
    servers:
      - "127.0.0.1:27500"
  - name: "sink"
    balance: "roundrobin"
    servers:
      - "127.0.0.1:27600"
